services:
  server:
    image: codeberg.org/forgejo/forgejo:11
    container_name: forgejo
    environment:
      USER_UID: 1000
      USER_GID: 1000
      FORGEJO__server__DOMAIN: git.talandar.dev             # comment out for non https
      FORGEJO__server__ROOT_URL: https://git.talandar.dev/  # comment out for non https
      FORGEJO__server__SSH_DOMAIN: git.talandar.dev         # comment out for non https
      SSH_PORT: 6022
      SSH_LISTEN_PORT: 22
    restart: unless-stopped
    networks:
      - forgejo
    volumes:
      - ./data:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "3000:3000"
      - "222:22"

networks:
  forgejo:
    external: false
