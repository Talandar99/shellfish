services:
  mc:
    image: itzg/minecraft-server:java17
    stop_grace_period: 30s   #time to save the world before docker sends SIGKILL (less than 10 sec might kill server before it saves)
    ports:
    #expose the Minecraft server port outside of container
    - "25565:25565"
    #rcon port for command execution, bound to localhost only (do NOT expose it publicly)
    #login to RCON using
    #mcrcon -H 127.0.0.1 -P 25575 -p $RCON_PASSWORD
    #- "127.0.0.1:25575:25575"
    environment:
      #REQUIRED for all types
      EULA: "TRUE"
      MEMORY: "7G"
      TYPE: FORGE
      FORGE_VERSION: 47.4.26
      VERSION: 1.20.1
      ENABLE_ROLLING_LOGS: "true"
      USE_AIKAR_FLAGS: "true" #aikar's flags - GC tuning for mc servers
      #RCON is always enabled inside the container, but the password is random
      #on every start, so it has to be pinned here to be usable from outside
      #RCON_PASSWORD: "CHANGE_ME"
      #gameplay
      MOTD: "Forge 1.20.1"
      DIFFICULTY: "hard"
      PVP: "true"
      MAX_PLAYERS: 10
      SPAWN_PROTECTION: 0
      VIEW_DISTANCE: 10
      SIMULATION_DISTANCE: 8
      ONLINE_MODE: "false" 
      #whitelist and ops - fill in player names and uncomment
      #WHITELIST: |
      #  nick1
      #  nick2
      #ENFORCE_WHITELIST: "true"
      #OPS: |
      #  nick1
    volumes:
    #use a named, managed volume for data volume
    - ./data:/data
