<!DOCTYPE html>
<html lang="pl">

<head>

    <title>Download Mods</title>
    <meta name="description" content="This is an example of a meta description.">
    <link rel="stylesheet" type="text/css" href="theme.css">
    <style>
        body {
            background-color: #2b2b2b;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 40px;
            margin: 0;
        }

        a {
            width: 340px;
            height: 60px;
            text-decoration: none;
        }

        button {
            width: 100%;
            height: 100%;
            cursor: pointer;
            padding: 12px 24px;
            font-size: 16px;
            background-color: #1a1a1a;
            color: #00aa66;
            border: 1px solid #00aa66;
            border-radius: 8px;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        button:hover {
            background-color: #00aa66;
            color: #1a1a1a;
        }
    </style>
</head>

<body>
    <a href="./modpack.zip" target="_blank" download>
        <button>DOWNLOAD MODS</button>
    </a>

    <a href="./custom_configuration.zip" target="_blank" download>
