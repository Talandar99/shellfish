services:
  navidrome:
    image: navidrome/navidrome:latest
    container_name: navidrome
    ports:
      - "4533:4533"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Warsaw
      - "ND_SCANNER_SCHEDULE=0 4 * * *"
      - ND_SCANNER_PURGEMISSING=always
      - ND_RECENTLYADDEDBYMODTIME=true
      - ND_BACKUP_PATH=/data/backup
      - "ND_BACKUP_SCHEDULE=0 30 4 * * *"
      - ND_BACKUP_COUNT=7
    volumes:
      - ./data:/data
      - ./music:/music:ro
    restart: unless-stopped
